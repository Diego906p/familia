<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizarra — Panel de Luanna</title>
  <link rel="stylesheet" href="css/pizarra.css?v=20">
</head>
<body>
<div class="pz-app" id="pzApp">

  <!-- Barra superior -->
  <div class="pz-topbar">
    <h1>🎨 Pizarra colaborativa</h1>
    <div class="pz-presence-bar" id="pzPresence"></div>
    <span class="pz-role-badge" id="pzRoleBadge" style="display:none">Administrador</span>
    <div class="pz-admin-top" id="pzAdminTop" style="display:none">
      <select id="pzBg" class="pz-select pz-top-select" title="Fondo de la pizarra">
        <option value="white">⬜ Blanco</option>
        <option value="grid">▦ Cuadriculado</option>
        <option value="lines">▤ Rayado</option>
      </select>
      <button class="pz-top-btn" id="pzLayersBtn" title="Capas">📁 Capas</button>
      <button class="pz-top-btn" id="pzAdminBtn" title="Configuración de Papá">⚙ Config</button>
    </div>
    <button class="pz-top-btn pz-play-btn" id="pzPlayBtn" title="Modo juego: Adivina el Dibujo">🎮 Jugar</button>
    <div class="spacer"></div>
    <button class="pz-top-btn" data-tool="laser" id="pzLaserTop" title="Puntero láser">🔦 Láser</button>
    <button class="pz-back" id="pzBack">‹ Volver</button>
  </div>

  <div class="pz-body">

    <!-- Barra lateral de herramientas -->
    <div class="pz-sidebar">
      <button class="pz-tool active" data-tool="select" title="Seleccionar (V)">↖️</button>
      <button class="pz-tool" data-tool="directselect" title="Selección directa de nodos (A)">🧷</button>
      <button class="pz-tool" data-tool="pan" title="Desplazar lienzo (H)">🖐️</button>
      <span class="pz-sep-h"></span>
      <button class="pz-tool" data-tool="pencil" title="Lápiz (B)">✏️</button>
      <button class="pz-tool" data-tool="highlighter" title="Resaltador">🖍️</button>
      <button class="pz-tool" data-tool="eraser" data-perm="eraser" title="Borrador (E)">🧽</button>
      <button class="pz-tool" data-tool="fill" title="Bote de relleno">🪣</button>
      <button class="pz-tool" data-tool="text" data-perm="text" title="Texto (T)">🔤</button>
      <span class="pz-sep-h"></span>
      <button class="pz-tool" id="pzShapeBtn" title="Formas, línea y flecha">▭</button>
      <button class="pz-tool" id="pzStickerBtn" data-perm="stickers" title="Stickers y sellos">🏷️</button>
      <span class="pz-sep-h"></span>
      <label class="pz-tool" data-perm="image" title="Insertar imagen">🖼️
        <input type="file" id="pzImage" accept="image/*" multiple style="display:none">
      </label>
      <button class="pz-tool" id="pzCalc" data-perm="calculator" title="Calculadora">🧮</button>
      <button class="pz-tool" id="pzLockEl" title="Fijar / liberar elemento">📌</button>
    </div>

    <!-- Centro: subbarra contextual + lienzo -->
    <div class="pz-center">
      <div class="pz-subbar">
        <button class="pz-tool sm" id="pzUndo" title="Deshacer (Ctrl+Z)">↶</button>
        <button class="pz-tool sm" id="pzRedo" title="Rehacer (Ctrl+Y)">↷</button>
        <span class="pz-sep"></span>
        <div class="pz-fgbg" id="pzFgBg">
          <button class="pz-fb pz-fb-stroke" id="pzFbStroke" title="Borde"></button>
          <button class="pz-fb pz-fb-fill" id="pzFbFill" title="Relleno"></button>
          <input type="color" id="pzFbInput">
        </div>
        <button class="pz-tool sm" id="pzFbSwap" title="Intercambiar relleno/borde">⇄</button>
        <button class="pz-tool sm" id="pzFbNone" title="Sin color (relleno/borde activo)">▱</button>
        <div class="pz-swatches" id="pzSwatches"></div>
        <button class="pz-tool sm" id="pzStyleBtn" title="Trazo y pincel">✒️</button>
        <span class="pz-sep"></span>
        <label class="pz-size">Grosor <input type="range" id="pzSize" min="1" max="200" value="4"></label>
        <button class="pz-tool sm" id="pzLock" title="Bloquear proporción">🔓</button>
        <span class="pz-sep"></span>
        <button class="pz-tool sm" id="pzZoomOut" title="Alejar">➖</button>
        <button class="pz-tool sm" id="pzZoomReset" title="Restablecer zoom" style="font-size:.7rem;font-weight:800">100%</button>
        <button class="pz-tool sm" id="pzZoomIn" title="Acercar">➕</button>
        <span class="spacer"></span>
        <button class="pz-label-btn pz-danger sm" id="pzClear" data-perm="clear">🗑️ Limpiar todo</button>
      </div>

      <div class="pz-stage" id="pzStage">
        <canvas id="pzCanvas"></canvas>
        <textarea id="pzTextInput" spellcheck="false"></textarea>

        <!-- Submenú de formas -->
        <div class="pz-shapes" id="pzShapeFly">
          <button data-tool="rect" title="Rectángulo">▭</button>
          <button data-tool="circle" title="Círculo / elipse">◯</button>
          <button data-tool="triangle" title="Triángulo">△</button>
          <button data-tool="star" title="Estrella">★</button>
          <button data-tool="polygon" title="Polígono">⬡</button>
          <button data-tool="line" title="Línea">╱</button>
          <button data-tool="arrow" title="Flecha">➜</button>
        </div>

        <!-- Modo juego: Adivina el Dibujo -->
        <div class="pz-game" id="pzGamePanel"><div class="pz-game-inner" id="pzGameBody"></div></div>
        <div class="pz-confetti" id="pzConfetti"></div>
        <div class="pz-brushcursor" id="pzBrushCursor"></div>
        <div class="pz-starsrow" id="pzStarsRow"></div>

        <!-- Barra de formato de texto -->
        <div class="pz-textbar" id="pzTextBar">
          <button id="pzTxtBold" title="Negrita"><b>B</b></button>
          <button id="pzTxtItalic" title="Cursiva"><i>I</i></button>
          <span class="pz-sep"></span>
          <button id="pzTxtLeft" title="Izquierda">⬅</button>
          <button id="pzTxtCenter" title="Centro">⬌</button>
          <button id="pzTxtRight" title="Derecha">➡</button>
          <span class="pz-sep"></span>
          <button id="pzTxtMinus" title="Menos tamaño">A−</button>
          <button id="pzTxtPlus" title="Más tamaño">A＋</button>
          <input type="color" id="pzTxtColor" title="Color del texto" value="#3c3160">
        </div>

        <!-- Barra contextual de selección -->
        <div class="pz-selbar" id="pzSelBar">
          <span class="pz-selbar-count" id="pzSelCount"></span>
          <span class="pz-sep"></span>
          <label class="pz-op">Opacidad <input type="range" id="pzOpacity" min="0" max="100" value="100"></label>
          <span class="pz-op-val" id="pzOpacityVal">100%</span>
          <span class="pz-sep"></span>
          <button class="pz-mini" id="pzFront" title="Traer al frente">⬆️</button>
          <button class="pz-mini" id="pzForward" title="Adelantar">🔼</button>
          <button class="pz-mini" id="pzBackward" title="Atrasar">🔽</button>
          <button class="pz-mini" id="pzBack2" title="Enviar al fondo">⬇️</button>
          <span class="pz-sep"></span>
          <button class="pz-mini" id="pzGroup" title="Agrupar (Ctrl+G)">🔗</button>
          <button class="pz-mini" id="pzUngroup" title="Desagrupar (Ctrl+Shift+G)">✂️</button>
          <button class="pz-mini" id="pzDup" title="Duplicar (Ctrl+D)">⧉</button>
          <button class="pz-mini" id="pzToShape" title="Convertir trazo en forma">⬟</button>
          <button class="pz-mini" id="pzDel" title="Eliminar (Supr)">🗑️</button>
          <span class="pz-sep pz-multi"></span>
          <button class="pz-mini pz-multi" id="pzAlignL" title="Alinear izquierda">⇤</button>
          <button class="pz-mini pz-multi" id="pzAlignCH" title="Centrar horizontal">↔</button>
          <button class="pz-mini pz-multi" id="pzAlignR" title="Alinear derecha">⇥</button>
          <button class="pz-mini pz-multi" id="pzAlignT" title="Alinear arriba">⤒</button>
          <button class="pz-mini pz-multi" id="pzAlignCV" title="Centrar vertical">↕</button>
          <button class="pz-mini pz-multi" id="pzAlignB" title="Alinear abajo">⤓</button>
          <button class="pz-mini pz-multi" id="pzDistH" title="Distribuir horizontal">⇿</button>
          <button class="pz-mini pz-multi" id="pzDistV" title="Distribuir vertical">⇳</button>
          <span class="pz-sep pz-multi"></span>
          <button class="pz-mini pz-multi" id="pzPfU" title="Unir">⬕</button>
          <button class="pz-mini pz-multi" id="pzPfS" title="Restar">◐</button>
          <button class="pz-mini pz-multi" id="pzPfI" title="Intersectar">◎</button>
          <button class="pz-mini pz-multi" id="pzPfX" title="Excluir">⊗</button>
        </div>

        <!-- Panel de color y estilo -->
        <div class="pz-style" id="pzStylePanel">
          <div class="pz-style-head"><span>✒️ Trazo y pincel</span><button id="pzStyleClose">✕</button></div>
          <div class="pz-style-body">
            <div class="pz-style-row"><label>Estilo</label>
              <select id="pzBorderStyle" class="pz-select">
                <option value="solid">Sólido ───</option><option value="dashed">Guiones ┄┄</option><option value="dotted">Puntos ┈┈</option>
              </select></div>
            <div class="pz-style-row"><label>Pincel</label>
              <select id="pzFidelity" class="pz-select">
                <option value="precise">Precisión</option><option value="balanced" selected>Equilibrado</option><option value="smooth">Suavizado</option>
              </select></div>
            <div class="pz-style-row"><label>Punta</label>
              <select id="pzBrushCap" class="pz-select">
                <option value="round" selected>Redondeada</option><option value="square">Cuadrada proyectada</option><option value="taper">En punta</option>
              </select></div>
            <div class="pz-style-recents"><span class="pz-recent-label">Recientes</span><div class="pz-recent-row" id="pzRecents"></div></div>
          </div>
        </div>

        <!-- Paleta de stickers -->
        <div class="pz-stickers" id="pzStickerPalette"></div>

        <!-- Calculadora -->
        <div class="pz-calc" id="pzCalcPanel">
          <div class="pz-calc-head"><span>🧮 Calculadora</span><button id="pzCalcClose">✕</button></div>
          <input type="text" id="pzCalcDisplay" readonly value="0">
          <div class="pz-calc-keys" id="pzCalcKeys"></div>
        </div>
      </div>
    </div>

  </div>
</div>

  <!-- Ventanas flotantes de Papá (ancladas a sus botones de la barra superior) -->
  <div class="pz-float" id="pzLayersPanel">
    <div class="pz-float-head"><span>🗂️ Capas</span><button class="pz-float-x" id="pzLayersClose">✕</button></div>
    <div class="pz-layers" id="pzLayers"></div>
  </div>
  <div class="pz-float" id="pzAdminMenu">
    <div class="pz-float-head"><span>⚙ Configuración de Papá</span><button class="pz-float-x" id="pzAdminClose">✕</button></div>
    <div class="pz-rp-title" style="margin-top:8px">🛡️ Permisos de Luanna e invitados</div>
    <div class="pz-perms-body" id="pzPermsBody"></div>
    <button class="pzg-btn" id="pzAdminEndGame" style="margin-top:10px;display:none">⏹ Terminar partida</button>
  </div>

  <!-- Botón oculto de permisos (compatibilidad con la lógica) -->
  <button id="pzPerms" style="display:none"></button>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/config.js?v=3"></script>
  <script src="js/auth.js?v=6"></script>
  <script src="js/pizarra.js?v=21"></script>
  <script src="js/juego.js?v=5"></script>
</body>
</html>
